<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="1" stop-color="#E6EEFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#glow)"/>
  <!-- browser window -->
  <g filter="url(#shadow)">
    <rect x="72" y="112" width="340" height="252" rx="30" fill="url(#screen)"/>
    <path d="M72 142a30 30 0 0 1 30-30h280a30 30 0 0 1 30 30v26H72z" fill="#1E1B4B" fill-opacity="0.9"/>
    <circle cx="104" cy="140" r="8" fill="#F59E0B"/>
    <circle cx="130" cy="140" r="8" fill="#A78BFA"/>
    <circle cx="156" cy="140" r="8" fill="#22D3EE"/>
    <rect x="184" y="130" width="196" height="20" rx="10" fill="#ffffff" fill-opacity="0.22"/>
    <rect x="104" y="196" width="150" height="18" rx="9" fill="#6D28D9" fill-opacity="0.85"/>
    <rect x="104" y="230" width="236" height="12" rx="6" fill="#94A3B8" fill-opacity="0.75"/>
    <rect x="104" y="254" width="206" height="12" rx="6" fill="#94A3B8" fill-opacity="0.6"/>
    <rect x="104" y="290" width="96" height="40" rx="12" fill="#3B82F6"/>
  </g>
  <!-- phone showing the same page -->
  <g filter="url(#shadow)">
    <rect x="300" y="214" width="146" height="232" rx="30" fill="#1E1B4B"/>
    <rect x="312" y="238" width="122" height="186" rx="18" fill="url(#screen)"/>
    <rect x="352" y="224" width="42" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="326" y="256" width="70" height="12" rx="6" fill="#6D28D9" fill-opacity="0.85"/>
    <rect x="326" y="280" width="94" height="8" rx="4" fill="#94A3B8" fill-opacity="0.75"/>
    <rect x="326" y="296" width="80" height="8" rx="4" fill="#94A3B8" fill-opacity="0.6"/>
    <rect x="326" y="318" width="48" height="22" rx="8" fill="#3B82F6"/>
    <!-- hand-over arrow: amber (you) and violet (Agent) -->
    <path d="M336 372h56" stroke="#F59E0B" stroke-width="9" stroke-linecap="round"/>
    <path d="M380 360l14 12-14 12" fill="none" stroke="#F59E0B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M410 400h-56" stroke="#8B5CF6" stroke-width="9" stroke-linecap="round"/>
    <path d="M366 388l-14 12 14 12" fill="none" stroke="#8B5CF6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- live dot -->
  <circle cx="420" cy="104" r="26" fill="#22C55E" fill-opacity="0.28"/>
  <circle cx="420" cy="104" r="14" fill="#4ADE80"/>
</svg>
